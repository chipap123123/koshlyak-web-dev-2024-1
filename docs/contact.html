<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Обратная связь - Food Construct</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="body">
    <header class="header">
        <h1 class="h1">Food Construct</h1>
        <nav class="nav">
            <a class="header a" href="index.html#section-1">О нас</a>
            <a class="header a" href="index.html">Собрать ланч</a>
            <a class="header a" href="index.html">Заказы</a>
            <a class="header a" href="index.html#section-2">Контакты</a>
            <a class="header a" href="contact.html">Обратная связь</a>
            <a class="header a" href="login.html">Вход</a>
        </nav>
    </header>
    <main>
        <section>
            <h2 class="h2">Форма обратной связи</h2>
            <form class="feedback-form" action="https://httpbin.org/post" method="POST">
                <div class="form-group">
                    <label for="fullname">ФИО</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label>Откуда узнали о нас</label>
                    <div class="radio-group">
                        <input type="radio" id="source-friends" name="source" value="friends" required>
                        <label for="source-friends">От друзей/знакомых</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" id="source-internet" name="source" value="internet">
                        <label for="source-internet">Из интернета</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" id="source-social" name="source" value="social">
                        <label for="source-social">Социальные сети</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" id="source-other" name="source" value="other">
                        <label for="source-other">Другое</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="type">Тип обращения</label>
                    <select id="type" name="type" required>
                        <option value="">Выберите тип обращения</option>
                        <option value="complaint">Жалоба</option>
                        <option value="suggestion">Предложение</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="message">Текст сообщения</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="attachment">Вложения</label>
                    <input type="file" id="attachment" name="attachment">
                    <small>Можно прикрепить файлы (jpg, png, pdf, doc)</small>
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="consent" name="consent" required>
                    <label for="consent">Даю согласие на обработку персональных данных</label>
                </div>
                
                <button type="submit" class="submit-btn">Отправить сообщение</button>
            </form>
        </section>
    </main>
    <footer class="footer">
        <section id="section-2">
            <p class="p">
                Позвонить нам
                <a>+7-000-000-00-00</a>
            </p>
        </section>    
    </footer>
</body>
</html>
